<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form Validation</title>

<style>

body{
    margin:0;
    padding:40px;
    font-family:Arial, sans-serif;
     background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
    color:black;
}

.container{
    width:650px;
    background:rgb(63, 112, 124);
    padding:35px;
    margin:auto;
    border-radius: 20px;
   
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

.container h1{
    text-align:center;
    margin-bottom:10px;
    font-size:38px;
}

.container p{
    text-align:center;
    margin-bottom:25px;
    color:black;
}

ul{
    list-style:none;
    padding:0;
}

li{
    display:flex;
    align-items:center;
    margin-bottom:15px;
}

label{
    width:150px;
    font-weight:bold;
    font-size:17px;
}

input[type="text"],
input[type="password"],
select,
textarea{
    flex:1;
    padding:12px;
    border:1px solid black;
   border-radius: 20px;
    outline:none;
    font-size:15px;
}

input[name="userid"],
input[name="passid"],
input[name="zip"]{
    width:180px;
    flex:none;
    padding:10px;
    font-size:14px;
}

.gender,
.language{
    display:flex;
    gap:20px;
    align-items:center;
}

textarea{
    height:100px;
    resize:none;
}

input[type="submit"]{
    width:120px;
    padding:14px;
    border:none;
   
    background:black;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
    margin-left:250px;
}

input[type="submit"]:hover{
    background:blue;
}

</style>
</head>

<body onload="document.registration.userid.focus();">

<div class="container">

<h1>Registration Form</h1>

<p>Use tab keys to move from one input field to the next.</p>

<form name="registration" onsubmit="return formValidation();">

<ul>

<li>
<label>USER ID:</label>
<input type="text" name="userid">
</li>

<li>
<label>Password:</label>
<input type="password" name="passid">
</li>

<li>
<label>Name:</label>
<input type="text" name="username">
</li>

<li>
<label>Address:</label>
<input type="text" name="address">
</li>

<li>
<label>Country:</label>

<select name="country">
<option value="Default">(Please select a country)</option>
<option value="Australia">Australia</option>
<option value="Canada">Canada</option>
<option value="pakistan">pakistan</option>
<option value="Russia">Russia</option>
<option value="india">india</option>
<option value="iran">iran</option>
</select>
</li>

<li>
<label>Zip Code:</label>
<input type="text" name="zip">
</li>

<li>
<label>E-mail:</label>
<input type="text" name="email">
</li>

<li>
<label>Sex:</label>

<div class="gender">
<input type="radio" name="sex" value="male">
<span>Male</span>

<input type="radio" name="sex" value="female">
<span>Female</span>
</div>
</li>

<li>
<label>Language:</label>

<div class="language">
<input type="checkbox" name="en" value="English" checked>
<span>English</span>

<input type="checkbox" name="nonen" value="Non English">
<span>Non English</span>
</div>
</li>

<li>
<label>About:</label>
<textarea name="desc"></textarea>
</li>

<li>
<input type="submit" value="Submit">
</li>

</ul>

</form>

</div>



<script>

function formValidation(){

let userid = document.registration.userid;
let passid = document.registration.passid;
let username = document.registration.username;
let country = document.registration.country;
let zip = document.registration.zip;
let email = document.registration.email;

if(userid.value.length < 5 || userid.value.length > 12){
    alert("User ID must be between 5 to 12 characters");
    userid.focus();
    return false;
}

if(passid.value.length < 7 || passid.value.length > 12){
    alert("Password must be between 7 to 12 characters");
    passid.focus();
    return false;
}

let letters = /^[A-Za-z ]+$/;

if(!username.value.match(letters)){
    alert("Name must contain alphabet characters only");
    username.focus();
    return false;
}

if(country.value == "Default"){
    alert("Please select your country");
    country.focus();
    return false;
}

let numbers = /^[0-9]+$/;

if(!zip.value.match(numbers)){
    alert("ZIP code must contain numbers only");
    zip.focus();
    return false;
}

let mailformat = /^\w+([.-]?\w+)*@\w+([.-]?\w+)*(\.\w{2,3})+$/;

if(!email.value.match(mailformat)){
    alert("Please enter a valid email address");
    email.focus();
    return false;
}

alert("Form submitted successfully!");

return true;

}

</script>

</body>
</html>
